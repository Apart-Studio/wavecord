<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="760" height="300" rx="14" fill="#ffffff"/>
  <text x="34" y="48" font-size="23" font-weight="700" fill="#0f172a">Event throughput under a burst of Lavalink events</text>
  <text x="34" y="74" font-size="13.5" fill="#64748b">Higher is better. Measured against the real Rust path: 500k player updates, localhost.</text>

  <!-- pure-Python row -->
  <text x="34" y="140" font-size="15" font-weight="600" fill="#334155">pure-Python</text>
  <rect x="34" y="152" width="333" height="34" rx="6" fill="#cbd5e1"/>
  <text x="380" y="174" font-size="15" font-weight="600" fill="#475569">170,000 ev/s</text>

  <!-- WaveCord row -->
  <text x="34" y="212" font-size="15" font-weight="700" fill="#0f172a">WaveCord</text>
  <rect x="34" y="224" width="451" height="34" rx="6" fill="#1db954"/>
  <text x="498" y="246" font-size="15" font-weight="700" fill="#0f172a">230,000 ev/s</text>
  <rect x="631" y="228" width="95" height="26" rx="13" fill="#0f172a"/>
  <text x="678" y="246" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1.35x</text>

  <text x="34" y="288" font-size="12.5" fill="#94a3b8">Reproduce with: python benchmarks/off_gil.py</text>
</svg>
