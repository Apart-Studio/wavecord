name: PR template check

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate PR follows the template
    runs-on: ubuntu-latest
    steps:
      - name: Check required template sections
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              "## Summary",
              "## Related issues",
              "## Type of change",
              "## How has this been tested?",
              "## AI disclosure",
              "## Checklist",
            ];
            const pr = context.payload.pull_request;
            const body = (pr.body || "").replace(/\r/g, "");
            const missing = required.filter((h) => !body.includes(h));

            if (missing.length === 0) {
              core.info("PR body contains every required template section.");
              return;
            }

            const list = missing.map((h) => "- `" + h + "`").join("\n");
            const comment = [
              "Thanks for the contribution, but this pull request does not follow the",
              "[pull request template](../blob/main/.github/PULL_REQUEST_TEMPLATE.md).",
              "",
              "The following required sections are missing or were changed:",
              "",
              list,
              "",
              "This PR has been marked `invalid` and closed. Please open a new pull",
              "request using the template unchanged, filling in each section.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: comment,
            });

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "invalid",
                color: "e4e669",
                description: "Does not follow the pull request template",
              });
            } catch (e) {
              core.info("Label 'invalid' already exists.");
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ["invalid"],
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });

            core.setFailed("PR does not follow the template: missing " + missing.join(", "));
