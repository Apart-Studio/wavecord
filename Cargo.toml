[workspace]
resolver = "2"
members = ["crates/wavecord-core", "crates/wavecord-py"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["WaveCord contributors"]
repository = "https://github.com/Apart-Studio/wavecord"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
percent-encoding = "2"
tracing = "0.1"
thiserror = "2"
pyo3 = "0.29"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

[profile.release]
lto = "thin"
codegen-units = 1
